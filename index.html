<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Wordle Xseed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen mobile game — header, hint strip, scrolling grid, keyboard pinned at the bottom. Celeste + sun gold, Uruguay party. */
:root{
  --bg:#f3f7fb; --surface:#ffffff; --fg:#14202b; --muted:#5b6b7a; --line:#d5dfe8;
  --accent:#2f86c9; --accent-ink:#ffffff; --sun:#e9a91f;
  --ok:#3a9a5b; --near:#d9a21b; --miss:#7d8a96; --tile-ink:#ffffff;
  --key:#dfe7ef; --key-ink:#14202b;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222d; --fg:#e8eef4; --muted:#93a4b4; --line:#2a3a48;
  --accent:#5aa9e6; --accent-ink:#06121c; --sun:#f2bc45;
  --ok:#3f9e60; --near:#c9961a; --miss:#3e4a55; --tile-ink:#ffffff;
  --key:#2a3946; --key-ink:#e8eef4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222d; --fg:#e8eef4; --muted:#93a4b4; --line:#2a3a48;
  --accent:#5aa9e6; --accent-ink:#06121c; --sun:#f2bc45;
  --ok:#3f9e60; --near:#c9961a; --miss:#3e4a55; --tile-ink:#ffffff;
  --key:#2a3946; --key-ink:#e8eef4; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:10px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.sun{width:34px;height:34px;flex:none}
.team h1{font-size:1.4rem;font-weight:800}
.team small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;text-align:right}
.stats b{display:block;font-family:var(--display);font-size:1.15rem}
.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* hints */
.hints{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hint{display:flex;gap:8px;align-items:baseline;font-size:.95rem}
.hint .n{font-family:var(--display);color:var(--sun);font-weight:800;flex:none}
.hint.locked{color:var(--muted)}
.next{font-size:.8rem;color:var(--muted)}
.hints.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--sun)}30%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 0 0 0 transparent}}

/* grid */
.board{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:4px}
.row{display:grid;gap:6px}
.tile{width:min(14vw,56px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;
  font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,6vw,1.8rem);text-transform:uppercase;background:var(--surface)}
.tile.filled{border-color:var(--muted)}
.tile.ok{background:var(--ok);border-color:var(--ok);color:var(--tile-ink)}
.tile.near{background:var(--near);border-color:var(--near);color:var(--tile-ink)}
.tile.miss{background:var(--miss);border-color:var(--miss);color:var(--tile-ink)}
.tile.pop{animation:pop .12s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.row.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9rem;z-index:5}

/* keyboard */
.kb{display:flex;flex-direction:column;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.kb .r{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:44px;height:52px;border:0;border-radius:6px;background:var(--key);color:var(--key-ink);font-weight:700;font-size:1rem;padding:0;touch-action:manipulation}
.k.wide{max-width:68px;flex:1.5;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.k.ok{background:var(--ok);color:var(--tile-ink)}.k.near{background:var(--near);color:var(--tile-ink)}.k.miss{background:var(--miss);color:var(--tile-ink);opacity:.7}

/* win */
.win{background:var(--surface);border:2px solid var(--ok);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.win h2{font-size:1.6rem}
.win .word{font-family:var(--display);font-size:2.2rem;font-weight:800;letter-spacing:.15em;color:var(--ok)}
.foot{text-align:center;font-size:.75rem;color:var(--muted)}
.foot button{background:none;border:0;text-decoration:underline;color:var(--muted);font-size:.75rem;padding:4px}

/* landing + organizer */
.page{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;display:flex;flex-direction:column;gap:18px}
.page h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800}
.lead{color:var(--muted);max-width:60ch;margin:0;line-height:1.5}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick a{display:block;text-align:center;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.2rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2{font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .w{font-family:var(--display);letter-spacing:.12em;color:var(--accent)}
.card ol{margin:0;padding-left:1.2em;font-size:.9rem;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.qr{align-self:center;background:#fff;padding:8px;border-radius:8px;line-height:0}
.qr img,.qr canvas{width:160px!important;height:160px!important}
.link{font-size:.75rem;color:var(--muted);word-break:break-all}
.btn{border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.base{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.base input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.9rem}
.rules{font-size:.9rem;color:var(--muted);line-height:1.5;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app"></div>

<script>
/* ======= SETTINGS ======= */
const BASE_URL = "https://giovannicg.github.io/wordle-xseed/"; // public site URL, used by the QR codes
const ADMIN_HASH = "organizador-xseed";
// Hints unlock by TIME (minutes) or ATTEMPTS, whichever comes first.
const HINT_MINUTES  = [4, 8, 12];
const HINT_ATTEMPTS = [8, 14, 20];
// 5-letter words, base64-encoded so they aren't readable at a glance.
const TEAMS = [
  {w:"VFJVU1Q=", h:["The glue of every good relationship.", "You build it slowly and lose it fast.", "Clients give it to you when you deliver."]},
  {w:"T1dORVI=", h:["Someone who takes ownership.", "'You build it, you run it' makes you the …", "The person whose name is on the ticket."]},
  {w:"VFJJQkU=", h:["Another word for community.", "A group that shares values and rituals.", "Xseed is one big …"]},
  {w:"TU9ERUw=", h:["The brain behind anything AI-powered.", "You train it, then you deploy it.", "GPT, Claude and Gemini are all one."]},
  {w:"Q0xFQVI=", h:["What transparency makes things.", "The opposite of foggy or hidden.", "Crystal …"]},
  {w:"U1FVQUQ=", h:["Another word for team.", "A small group that works side by side.", "Your project …, in five letters."]},
  {w:"TEFUQU0=", h:["Where Xseed finds its talent.", "From Mexico down to Patagonia.", "Short for Latin America."]},
  {w:"QVNBRE8=", h:["A Sunday tradition in Uruguay.", "Fire, a grill and lots of patience.", "The Uruguayan barbecue."]},
];
/* ========================================= */

const dec = s => decodeURIComponent(escape(atob(s)));
const app = document.getElementById('app');
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const sunSVG = `<svg class="sun" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--sun)"><circle cx="20" cy="20" r="8"/>${Array.from({length:16},(_,i)=>{const a=i*Math.PI/8,r1=11,r2=i%2?16:18;return `<path d="M${20+Math.cos(a-.12)*r1} ${20+Math.sin(a-.12)*r1}L${20+Math.cos(a)*r2} ${20+Math.sin(a)*r2}L${20+Math.cos(a+.12)*r1} ${20+Math.sin(a+.12)*r1}Z"/>`}).join('')}</g></svg>`;

let timerId = null;
function route(){
  clearInterval(timerId); document.onkeydown = null;
  const h = location.hash.slice(1);
  const m = h.match(/^equipo-(\d)$/);
  if (m && TEAMS[+m[1]-1]) return game(+m[1]);
  if (h === ADMIN_HASH) return admin();
  landing();
}
window.addEventListener('hashchange', route);

/* ---------- landing ---------- */
function landing(){
  app.innerHTML = `<div class="page">
    <div class="team">${sunSVG}<div><small>Team-building game</small><h1>Wordle Xseed</h1></div></div>
    <p class="lead">Every team has its own 5-letter word. Pick your team, or scan the QR code you were given.</p>
    <div class="pick">${TEAMS.map((_,i)=>`<a href="#equipo-${i+1}">Team ${i+1}</a>`).join('')}</div>
  </div>`;
}

/* ---------- game ---------- */
function game(n){
  const T = TEAMS[n-1], WORD = dec(T.w).toUpperCase(), L = WORD.length, KEY = 'wx-eq'+n;
  let st = store.get(KEY);
  if (!st || st.word !== T.w) st = {word:T.w, start:Date.now(), guesses:[], won:false, end:null};
  let cur = '', shown = unlocked();
  const save = () => store.set(KEY, st);
  save();

  function unlocked(){
    const mins = ((st.end||Date.now()) - st.start)/60000, tries = st.guesses.length;
    let c = 0; for (let i=0;i<T.h.length;i++) if (mins>=HINT_MINUTES[i] || tries>=HINT_ATTEMPTS[i]) c=i+1;
    return c;
  }
  function score(g){
    const res = Array(L).fill('miss'), pool = {};
    for (let i=0;i<L;i++){ if (g[i]===WORD[i]) res[i]='ok'; else pool[WORD[i]]=(pool[WORD[i]]||0)+1; }
    for (let i=0;i<L;i++) if (res[i]!=='ok' && pool[g[i]]>0){ res[i]='near'; pool[g[i]]--; }
    return res;
  }
  const fmt = ms => { const s=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

  app.innerHTML = `<div class="wrap">
    <div class="top">
      <div class="team">${sunSVG}<div><small>Wordle Xseed</small><h1>Team ${n}</h1></div></div>
      <div class="stats"><div><b id="time">0:00</b><span>Time</span></div><div><b id="tries">0</b><span>Tries</span></div></div>
    </div>
    <div class="hints" id="hints" aria-live="polite"></div>
    <div class="board" id="board"></div>
    <div id="bottom"></div>
  </div>`;
  const $ = id => document.getElementById(id);

  function renderHints(){
    const c = unlocked(), box = $('hints');
    let html = T.h.map((h,i)=> i<c
      ? `<div class="hint"><span class="n">Hint ${i+1}</span><span>${h}</span></div>`
      : '').join('');
    if (c===0) html = `<div class="hint locked"><span class="n">Hints</span><span>No hints yet. Start guessing!</span></div>`;
    if (c<T.h.length && !st.won){
      const leftMs = st.start + HINT_MINUTES[c]*60000 - Date.now(), leftT = HINT_ATTEMPTS[c]-st.guesses.length;
      html += `<div class="next">Next hint in ${fmt(leftMs)} or after ${leftT} more ${leftT===1?'try':'tries'}.</div>`;
    }
    box.innerHTML = html;
    if (c>shown){ shown=c; box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); toast('New hint unlocked!'); }
  }
  function rowHTML(g, res, cls=''){
    return `<div class="row ${cls}" style="grid-template-columns:repeat(${L},auto)">${Array.from({length:L},(_,i)=>{
      const ch = g[i]||''; const c = res?res[i]:(ch?'filled':'');
      return `<div class="tile ${c}">${ch}</div>`;}).join('')}</div>`;
  }
  function renderBoard(scroll=true){
    const b = $('board');
    b.innerHTML = st.guesses.map(g=>rowHTML(g,score(g))).join('') + (st.won?'':rowHTML(cur,null,'cur'));
    if (scroll) b.scrollTop = b.scrollHeight;
  }
  function renderBottom(){
    const bot = $('bottom');
    if (st.won){
      bot.innerHTML = `<div class="win"><h2>You got it!</h2><div class="word">${WORD}</div>
        <div>${st.guesses.length} tries · ${fmt(st.end-st.start)} · ${unlocked()} ${unlocked()===1?'hint':'hints'}</div>
        <div class="next">Show this screen to the organizer.</div></div>
        <div class="foot"><button id="reset">Restart on this phone</button></div>`;
    } else {
      const states = {};
      st.guesses.forEach(g=>score(g).forEach((r,i)=>{const p=states[g[i]]; if(r==='ok'||(r==='near'&&p!=='ok')||(!p)) states[g[i]]=r;}));
      const rows = ['QWERTYUIOP','ASDFGHJKL','⏎ZXCVBNM⌫'];
      bot.innerHTML = `<div class="kb">${rows.map(r=>`<div class="r">${[...r].map(k=>{
        if (k==='⏎') return `<button class="k wide" data-k="ENTER">Enter</button>`;
        if (k==='⌫') return `<button class="k wide" data-k="DEL" aria-label="Delete">⌫</button>`;
        return `<button class="k ${states[k]||''}" data-k="${k}">${k}</button>`;}).join('')}</div>`).join('')}</div>
        <div class="foot"><button id="reset">Restart on this phone</button></div>`;
      bot.querySelectorAll('.k').forEach(b=>b.addEventListener('click',()=>press(b.dataset.k)));
    }
    let armed=false; $('reset').addEventListener('click',e=>{
      if(!armed){armed=true;e.target.textContent='Tap again to erase your progress';setTimeout(()=>{armed=false;e.target.textContent='Restart on this phone'},3000);return;}
      store.del(KEY); route();
    });
  }
  function press(k){
    if (st.won) return;
    if (k==='DEL'){ cur=cur.slice(0,-1); renderBoard(false); return; }
    if (k==='ENTER'){
      if (cur.length<L){ const r=document.querySelector('.row.cur'); r&&r.classList.add('shake'); setTimeout(()=>r&&r.classList.remove('shake'),400); toast(`The word has ${L} letters`); return; }
      st.guesses.push(cur);
      if (cur===WORD){ st.won=true; st.end=Date.now(); }
      cur=''; save(); renderBoard(); renderBottom(); renderHints(); tick();
      return;
    }
    if (cur.length<L && /^[A-Z]$/.test(k)){ cur+=k; renderBoard(false); const t=document.querySelectorAll('.row.cur .tile')[cur.length-1]; t&&t.classList.add('pop'); }
  }
  document.onkeydown = e => {
    if (e.metaKey||e.ctrlKey||e.altKey) return;
    if (e.key==='Enter') press('ENTER'); else if (e.key==='Backspace') press('DEL');
    else { const k=e.key.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase(); if (/^[A-Z]$/.test(k)) press(k); }
  };
  function tick(){
    $('time').textContent = fmt((st.end||Date.now())-st.start);
    $('tries').textContent = st.guesses.length;
    if (!st.won) renderHints();
  }
  renderHints(); renderBoard(); renderBottom(); tick();
  timerId = setInterval(tick, 1000);
}

let toastT;
function toast(msg){
  let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800);
}

/* ---------- organizer ---------- */
